name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8.15.9
      - uses: actions/setup-node@v3
        with:
          node-version: 18.20.8
          cache: pnpm

      - run:  pnpm install
      - run:  pnpm build
